name: forkprobe
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.PROBE_PROVIDER }}
          service_account: ${{ secrets.PROBE_SA }}
